<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tablet">
  <defs>
    <linearGradient id="tb-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7785"/>
      <stop offset=".5" stop-color="#48515c"/>
      <stop offset="1" stop-color="#2d343c"/>
    </linearGradient>
    <linearGradient id="tb-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b9e76"/>
      <stop offset="1" stop-color="#0f6fb3"/>
    </linearGradient>
    <linearGradient id="tb-gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".40"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#eef3f1"/>
  <!-- shadow -->
  <ellipse cx="33" cy="57.5" rx="18" ry="2.6" fill="#1f2a33" opacity=".18"/>
  <!-- body -->
  <rect x="13" y="6" width="38" height="51" rx="4.6" fill="url(#tb-body)"/>
  <rect x="13.6" y="6.6" width="36.8" height="49.8" rx="4.1" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width=".8"/>
  <!-- screen -->
  <rect x="16.3" y="9.3" width="31.4" height="44.4" rx="2" fill="url(#tb-wall)"/>
  <!-- camera -->
  <circle cx="32" cy="7.8" r=".7" fill="#aab4bd"/>
  <!-- app icons -->
  <g>
    <rect x="19" y="13" width="6" height="6" rx="1.6" fill="#ffffff" fill-opacity=".92"/>
    <rect x="29" y="13" width="6" height="6" rx="1.6" fill="#ffd34d"/>
    <rect x="39" y="13" width="6" height="6" rx="1.6" fill="#ff7a59"/>
    <rect x="19" y="22" width="6" height="6" rx="1.6" fill="#7c5cff"/>
    <rect x="29" y="22" width="6" height="6" rx="1.6" fill="#ffffff" fill-opacity=".9"/>
    <rect x="39" y="22" width="6" height="6" rx="1.6" fill="#36c26b"/>
    <rect x="19" y="31" width="6" height="6" rx="1.6" fill="#45c6ff"/>
    <rect x="29" y="31" width="6" height="6" rx="1.6" fill="#ff6b9d"/>
    <rect x="39" y="31" width="6" height="6" rx="1.6" fill="#ffffff" fill-opacity=".9"/>
  </g>
  <!-- dock -->
  <rect x="18" y="43" width="28" height="8" rx="3" fill="#ffffff" fill-opacity=".22"/>
  <rect x="21" y="45" width="4.5" height="4.5" rx="1.2" fill="#ffffff" fill-opacity=".95"/>
  <rect x="29.75" y="45" width="4.5" height="4.5" rx="1.2" fill="#ffd34d"/>
  <rect x="38.5" y="45" width="4.5" height="4.5" rx="1.2" fill="#ff7a59"/>
  <!-- glossy reflection -->
  <path d="M16.3 9.3h18L20 53.7h-3.7V11.3z" fill="url(#tb-gloss)"/>
</svg>
