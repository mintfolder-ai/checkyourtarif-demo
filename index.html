      rel="stylesheet"
    />
    <script>
      window.addEventListener('error', function (e) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;inset:80px 8px auto 8px;z-index:99999;background:#fee;color:#900;padding:12px;font:12px monospace;white-space:pre-wrap;border:2px solid #900;max-height:60vh;overflow:auto';
        d.textContent = 'ERR: ' + (e.message || e.error) + '\n@ ' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || '');
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;inset:auto 8px 8px 8px;z-index:99999;background:#ffe;color:#b60;padding:12px;font:12px monospace;white-space:pre-wrap;border:2px solid #c60;max-height:40vh;overflow:auto';
        d.textContent = 'REJECT: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason));
        document.body.appendChild(d);
      });
    </script>
